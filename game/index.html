<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Palm Verge — Neon Heat</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1026; font-family: "Segoe UI", system-ui, -apple-system, sans-serif; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #ui { position: fixed; inset: 0; pointer-events: none; }
  .hud { position: absolute; inset: 0; }
  .panel { position: absolute; background: rgba(10, 14, 24, 0.62); border: 1px solid rgba(255,255,255,0.14); border-radius: 10px; padding: 10px 14px; color: #eef1f5; backdrop-filter: blur(3px); }
  .topleft { top: 16px; left: 16px; min-width: 190px; }
  .bar { width: 190px; height: 14px; background: rgba(255,255,255,0.12); border-radius: 7px; overflow: hidden; margin-bottom: 8px; }
  .fill { height: 100%; width: 100%; transition: width 0.15s; }
  .fill.health { background: #4fc36b; }
  .ammo { font-size: 14px; color: #cfd6e4; }
  .money { font-size: 22px; font-weight: 700; color: #7CFC00; margin-top: 2px; }
  .wanted { font-size: 20px; letter-spacing: 3px; margin-top: 2px; }
  .clock { font-size: 14px; color: #9fb4c8; margin-top: 2px; }
  .objective { top: 16px; left: 50%; transform: translateX(-50%); max-width: 460px; text-align: center; }
  .obj-title { font-size: 13px; font-weight: 700; letter-spacing: 2px; color: #ffd23d; text-transform: uppercase; }
  .obj-text { font-size: 15px; margin-top: 4px; }
  .obj-timer { font-size: 15px; font-weight: 700; color: #ff8a5c; margin-top: 2px; }
  .minimap { position: absolute; top: 16px; right: 16px; width: 180px; height: 180px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.25); background: #10141c; }
  .speed { bottom: 20px; right: 20px; text-align: center; min-width: 90px; }
  .speed-num { font-size: 34px; font-weight: 800; color: #2fe8ff; }
  .speed-unit { font-size: 11px; color: #9fb4c8; letter-spacing: 2px; }
  .crosshair { position: absolute; left: 50%; top: 50%; width: 18px; height: 18px; transform: translate(-50%, -50%); }
  .crosshair::before, .crosshair::after { content: ""; position: absolute; background: rgba(255,255,255,0.85); }
  .crosshair::before { left: 8px; top: 0; width: 2px; height: 18px; }
  .crosshair::after { top: 8px; left: 0; width: 18px; height: 2px; }
  .vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 55%, rgba(200,30,30,0.55) 100%); opacity: 0; }
  .toast { position: absolute; bottom: 110px; left: 50%; transform: translateX(-50%); background: rgba(10,14,24,0.8); color: #fff; padding: 10px 22px; border-radius: 8px; font-size: 16px; opacity: 0; transition: opacity 0.25s; }
  .toast.show { opacity: 1; }
  .briefing { position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%); width: 560px; max-width: 90vw; background: rgba(10,14,24,0.82); border-left: 4px solid #ffd23d; border-radius: 8px; padding: 12px 18px; color: #eef1f5; opacity: 0; transition: opacity 0.3s; }
  .briefing.show { opacity: 1; }
  .brief-title { font-weight: 700; color: #ffd23d; font-size: 15px; }
  .brief-text { font-size: 14px; margin-top: 4px; line-height: 1.45; }
  .hint { position: absolute; bottom: 170px; left: 50%; transform: translateX(-50%); background: rgba(10,14,24,0.75); color: #2fe8ff; padding: 6px 16px; border-radius: 6px; font-size: 14px; }
  .menu { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 7vh; box-sizing: border-box; pointer-events: auto; background: radial-gradient(ellipse at center, rgba(11,16,38,0.25) 0%, rgba(11,16,38,0.78) 100%); color: #eef1f5; text-align: center; }
  .game-title { font-size: 84px; font-weight: 900; letter-spacing: 10px; color: #fff; text-shadow: 0 0 30px #ff3d8a, 0 0 60px #ff3d8a; }
  .game-sub { font-size: 40px; font-weight: 800; letter-spacing: 22px; color: #2fe8ff; text-shadow: 0 0 24px #2fe8ff; margin-top: -8px; }
  .game-tag { font-size: 16px; color: #cfd6e4; margin-top: 14px; font-style: italic; }
  .menu-title { font-size: 56px; font-weight: 900; letter-spacing: 8px; text-shadow: 0 0 24px rgba(255,61,138,0.7); }
  .menu-text { font-size: 17px; color: #cfd6e4; margin-top: 10px; max-width: 520px; }
  .buttons { display: flex; gap: 14px; margin-top: 26px; }
  .btn { pointer-events: auto; cursor: pointer; font-family: inherit; font-size: 17px; font-weight: 700; padding: 13px 30px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.3); background: rgba(20,26,42,0.85); color: #fff; transition: all 0.15s; }
  .btn:hover:not(:disabled) { background: #ff3d8a; border-color: #ff3d8a; transform: translateY(-2px); }
  .btn.primary { background: #ff3d8a; border-color: #ff3d8a; }
  .btn.primary:hover:not(:disabled) { background: #ff5c9e; }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .controls { margin-top: 28px; font-size: 14px; line-height: 1.9; color: #c3cfdd; background: rgba(8,12,20,0.55); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 12px 22px; backdrop-filter: blur(3px); }
  .controls-row { white-space: pre; }
  .pause-screen, .end-screen { display: none; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Palm Verge Neon Heat: an open-world crime game. Walk, drive, steal cars, complete missions and lose the police."></canvas>
<div id="ui"></div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
